name: Solo reader CI

on:
  push:
    branches:
      - solo-reader-redesign
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log

      - name: Preserve typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: ci-typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after a failed typecheck
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
